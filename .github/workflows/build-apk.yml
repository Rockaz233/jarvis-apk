name: Build Jarvis Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-AI-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create Release (Optional on Push to main)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "J.A.R.V.I.S. Android APK Release #${{ github.run_number }}"
          body: |
            ### J.A.R.V.I.S. AI Android Assistant
            - **Google Gemini 2.0 / 1.5 Flash** integrated brain
            - **Voice Input (Speech-to-Text)** and **Voice Output (Text-to-Speech)**
            - Futuristic Stark Arc Reactor HUD
            - Download the attached `.apk` file directly to your phone and install!
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
