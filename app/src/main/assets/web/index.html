<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S. AI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="hud-scanline"></div>
    <div class="hud-vignette"></div>

    <header class="hud-header">
        <div class="hud-brand">
            <span class="status-dot"></span>
            <span class="hud-title">J.A.R.V.I.S.</span>
            <span class="hud-version">v2.5 // ONLINE</span>
        </div>
        <div class="hud-stats">
            <div class="stat-item" id="stat-battery">
                <span class="stat-label">PWR</span>
                <span class="stat-val" id="battery-level">--%</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">TIME</span>
                <span class="stat-val" id="hud-clock">00:00:00</span>
            </div>
            <button class="settings-btn" id="open-settings-btn" title="System Settings">⚙</button>
        </div>
    </header>

    <main class="hud-main">
        <!-- Arc Reactor Voice Visualizer -->
        <section class="reactor-container">
            <div class="reactor-outer-ring"></div>
            <div class="reactor-middle-ring"></div>
            <div class="reactor-inner-ring"></div>
            <div class="reactor-core" id="reactor-trigger">
                <div class="core-glow"></div>
                <div class="core-icon">
                    <svg viewBox="0 0 24 24" class="mic-svg" id="mic-icon">
                        <path fill="currentColor" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path fill="currentColor" d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </div>
            </div>
            <div class="sound-wave-canvas-wrapper">
                <canvas id="sound-waves" width="280" height="70"></canvas>
            </div>
            <div class="reactor-status" id="reactor-status">STANDBY // TAP TO SPEAK</div>
        </section>

        <!-- Dynamic Output / Conversation Feed -->
        <section class="feed-container">
            <div class="feed-header">
                <span class="feed-title">// COMMUNICATIONS STREAM</span>
                <button class="clear-feed-btn" id="clear-feed-btn">CLEAR</button>
            </div>
            <div class="feed-messages" id="feed-messages">
                <div class="message jarvis-msg">
                    <div class="msg-sender">J.A.R.V.I.S.</div>
                    <div class="msg-text">At your service, Sir. Systems initialized. All protocols green. How may I assist you today?</div>
                    <div class="msg-time">SYSTEM</div>
                </div>
            </div>
        </section>

        <!-- Command Input Tray -->
        <footer class="input-tray">
            <div class="input-wrapper">
                <input type="text" id="user-text-input" placeholder="Give an order or tap mic..." autocomplete="off">
                <button id="send-btn" class="send-btn" title="Transmit">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
        </footer>
    </main>

    <!-- Quick Shortcuts Toolbar -->
    <div class="quick-bar">
        <button class="quick-chip" data-cmd="What is the current time and date?">🕒 Time</button>
        <button class="quick-chip" data-cmd="Tell me today's motivation and tech briefing">💡 Briefing</button>
        <button class="quick-chip" data-cmd="Tell me a witty joke, Jarvis">🤖 Humor</button>
        <button class="quick-chip" data-cmd="Tell me your status and diagnostics">⚡ Diagnostic</button>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal-box">
            <div class="modal-header">
                <h3>// SYSTEM CONFIGURATION</h3>
                <button class="modal-close-btn" id="close-settings-btn">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="gemini-api-key">Google Gemini API Key (100% Free):</label>
                    <input type="password" id="gemini-api-key" placeholder="AIzaSy...">
                    <small>Get a free API key at <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a></small>
                </div>
                <div class="form-group">
                    <label for="gemini-model-select">AI Brain Model:</label>
                    <select id="gemini-model-select">
                        <option value="gemini-2.0-flash">Gemini 2.0 Flash (Fastest & Smartest)</option>
                        <option value="gemini-1.5-flash">Gemini 1.5 Flash (Standard Free)</option>
                        <option value="gemini-1.5-pro">Gemini 1.5 Pro (Deep Reasoning)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="voice-pitch">Voice Pitch:</label>
                    <input type="range" id="voice-pitch" min="0.5" max="1.5" step="0.1" value="0.95">
                </div>
                <div class="form-group">
                    <label for="voice-rate">Voice Speed:</label>
                    <input type="range" id="voice-rate" min="0.7" max="1.4" step="0.1" value="1.05">
                </div>
                <div class="form-group-checkbox">
                    <input type="checkbox" id="auto-speak-toggle" checked>
                    <label for="auto-speak-toggle">Auto-speak Jarvis voice replies</label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-save-btn" id="save-settings-btn">SAVE CONFIG</button>
            </div>
        </div>
    </div>

    <script src="jarvis-core.js"></script>
    <script src="app.js"></script>
</body>
</html>
